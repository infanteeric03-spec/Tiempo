<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiempo</title>
<meta name="description" content="Previsión del tiempo por horas y a 7 días, con tu ciudad predeterminada.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#eef3f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a1f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiempo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna estrecha. Cabecera con buscador, ciudad actual, horas en tira, 7 días en lista. */
:root{
  --bg:#eef3f4; --surface:#ffffff; --surface-2:#e3ebed; --fg:#14272d; --muted:#5a7078;
  --line:#d3dfe2; --accent:#0e7490; --accent-fg:#ffffff; --sun:#e8a317; --cloud:#8aa1aa; --rain:#2f7fb8; --bar:#9bc7d6; --good:#1a7f5a; --warn:#b7791f; --bad:#c2410c;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a1f; --surface:#132a31; --surface-2:#1a363f; --fg:#e6f0f2; --muted:#8fa9b1;
    --line:#244650; --accent:#5ec4de; --accent-fg:#0c1a1f; --sun:#f2b73a; --cloud:#7f98a1; --rain:#6fb4e6; --bar:#3c7f93; --good:#4cc9a0; --warn:#f2b73a; --bad:#f08a5d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --surface:#132a31; --surface-2:#1a363f; --fg:#e6f0f2; --muted:#8fa9b1;
  --line:#244650; --accent:#5ec4de; --accent-fg:#0c1a1f; --sun:#f2b73a; --cloud:#7f98a1; --rain:#6fb4e6; --bar:#3c7f93; --good:#4cc9a0; --warn:#f2b73a; --bad:#f08a5d;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
main{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--font-display);margin:0;font-weight:700;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* Buscador */
.search{position:relative}
.search form{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible,button:focus-visible,.result:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.loc{display:grid;place-items:center;padding:0 12px}
.btn.loc svg{width:22px;height:22px}
.btn.loc:disabled{opacity:.6;cursor:progress}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:-6px}
.opts label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.note{margin:0;font-size:.85rem;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.result{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer}
.result:last-child{border-bottom:0}
.result:hover{background:var(--surface-2)}
.result small{display:block;color:var(--muted)}
.msg{color:var(--muted);padding:12px 14px}

/* Ciudad actual */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.place h1{font-size:1.6rem;line-height:1.15}
.place p{margin:2px 0 0;color:var(--muted)}
.pin{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:7px 12px}
.pin[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.hero .now{display:flex;align-items:center;gap:16px}
.hero .now svg{width:84px;height:84px;flex:none}
.temp{font-family:var(--font-display);font-size:4.2rem;line-height:1;font-weight:700;letter-spacing:-.03em}
.desc{font-weight:600}
.feels{color:var(--muted);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat span{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-size:1.1rem;font-weight:600}

/* Pestañas y vista de playas */
.view{display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px}
.tabbtn{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-radius:10px;padding:10px 8px;cursor:pointer}
.tabbtn[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tabbtn:focus-visible,.chip:focus-visible,.bh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pctl{display:flex;flex-direction:column;gap:10px}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px}
.verdict h2{font-size:1.15rem}
.verdict p{margin:0;color:var(--muted)}
.tide{padding:0 16px;display:flex;flex-direction:column;gap:6px}
.tsvg{display:block;width:100%;max-width:560px;height:auto;touch-action:pan-y;cursor:crosshair}
.tsvg:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tsvg text{font-family:var(--font-body);font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tsvg text.tl{font-size:11px;font-weight:600;fill:var(--fg)}
.tread{min-height:1.4em;font-size:.9rem;color:var(--muted)}
.tread b{color:var(--fg);font-weight:600}
.tev{list-style:none;margin:10px 0 0;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tev li{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.tev span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.tev b{font-size:1.05rem;font-weight:600}
.tev small{color:var(--muted);font-size:.8rem}
.tcard summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;padding:0 16px;margin-bottom:10px;border-radius:12px}
.tcard summary::-webkit-details-marker{display:none}
.tcard summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.tcard details[open] summary::after{transform:rotate(-135deg)}
section.box.tcard summary h2{padding-inline:0;margin:0}
.tcard summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tsub{flex-basis:100%;order:3;color:var(--muted);font-size:.8rem}
.tcard details[open] .tsub{display:none}
.tsum{margin:10px 0 0;padding:0 16px;color:var(--muted);font-size:.85rem}
.blist{list-style:none;margin:0;padding:0 16px}
.bch{border-top:1px solid var(--line)}
.bch:first-child{border-top:0}
.bh{width:100%;display:grid;grid-template-columns:1.8rem minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;padding:12px 0;font:inherit;color:inherit;text-align:left;background:none;border:0;cursor:pointer}
.rk{font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--muted);text-align:center}
.bn{min-width:0}
.bn b{display:block}
.bn small{color:var(--muted)}
.bs{text-align:right}
.bs b{font-family:var(--font-display);font-size:1.5rem;line-height:1}
.bs small{display:block;font-size:.78rem;color:var(--muted)}
.bbar{grid-column:2 / 4;display:block;height:6px;border-radius:3px;background:var(--surface-2)}
.bbar i{display:block;height:100%;border-radius:3px}
.bline{grid-column:2 / 4;font-size:.85rem;color:var(--muted)}
.btags{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg)}
.tag.alert{background:none;border:1px solid var(--bad);font-weight:600}
.bd{padding:0 0 12px 2.3rem;display:flex;flex-direction:column;gap:10px}
.bd p{margin:0}
.bnote{color:var(--muted)}
.pfoot{padding:0 16px;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.85rem}
.pfoot p{margin:0}
.pfoot a{color:inherit}
.pfoot .more summary{padding-bottom:6px}

/* Secciones */
section.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 0 12px}
section.box h2{font-size:1.05rem;padding-inline:16px;margin-bottom:10px}
.hours{position:relative;display:flex;gap:4px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity}
.hour{flex:none;width:64px;text-align:center;padding:10px 4px;border-radius:12px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hour.now{background:var(--surface-2)}
.hour.past{opacity:.45}
.hour .t{font-size:.85rem;color:var(--muted)}
.hour svg{width:30px;height:30px}
.hour .d{font-weight:600}
.hour .p{font-size:.78rem;color:var(--rain);min-height:1.1em}
.hour:hover{background:var(--surface-2)}
.hour[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent)}
.hour:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hpanel{margin:8px 16px 4px;padding:14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.day-detail .hpanel{margin-inline:0}
.hp-head{font-weight:600;text-transform:capitalize}
.hp-sum{margin:0}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.hs{min-width:0;background:var(--surface);border-radius:10px;padding:8px 10px}
.hs span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.hs b{font-weight:600;font-size:1.05rem}
.hs small{display:block;color:var(--muted);font-size:.78rem}
.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;padding:2px 0 8px}
.more summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.days{list-style:none;margin:0;padding:0 16px}
.day-item{border-top:1px solid var(--line)}
.day-item:first-child{border-top:0}
.day{width:100%;display:grid;grid-template-columns:3.4rem 28px 2.6rem 1fr 2.6rem 14px;align-items:center;gap:10px;padding:10px 0;font:inherit;color:inherit;text-align:left;background:none;border:0;cursor:pointer}
.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.day .name{font-weight:600;text-transform:capitalize}
.day svg{width:28px;height:28px}
.day .lo{color:var(--muted);text-align:right}
.day .hi{font-weight:600}
.day .chev{width:14px;height:14px;color:var(--muted);transition:transform .2s}
.day[aria-expanded="true"] .chev{transform:rotate(180deg)}
.range{display:block;position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
.range i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--bar)}
.day .rain{display:block;grid-column:3 / 6;font-size:.78rem;color:var(--rain);margin-top:-6px}
.day-detail{padding-bottom:10px}
.day-detail .hours{padding-inline:0}
.det-sum{margin:0 0 6px;color:var(--muted);font-size:.85rem}
.hint{margin:-6px 0 6px;padding-inline:16px;color:var(--muted);font-size:.85rem}
.offline{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:var(--surface-2);color:var(--muted);font-size:.9rem;text-align:center}
.foot{color:var(--muted);font-size:.8rem;text-align:center}
.foot a{color:inherit}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (max-width:400px){
  .temp{font-size:3.4rem}
  .hero .now svg{width:68px;height:68px}
  .day{grid-template-columns:3rem 26px 2.3rem 1fr 2.3rem 12px;gap:8px}
}
@media (prefers-reduced-motion:no-preference){ .hours{scroll-behavior:smooth} }
</style>
</head>
<body>
<main>
  <nav class="tabs" aria-label="Secciones">
    <button class="tabbtn" id="tab-tiempo" type="button" aria-current="page">Tiempo</button>
    <button class="tabbtn" id="tab-playas" type="button">Playas con niños</button>
  </nav>
  <div id="view-tiempo" class="view">
  <div class="search">
    <form id="form" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="Buscar ciudad…" aria-label="Buscar ciudad" autocomplete="off" enterkeyhint="search">
      <button class="btn primary" type="submit">Buscar</button>
      <button class="btn loc" id="loc" type="button" aria-label="Usar mi ubicación" title="Usar mi ubicación"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </form>
    <div id="results" class="results" hidden role="listbox"></div>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="auto"> Abrir siempre con mi ubicación</label>
    <p id="note" class="note" role="status" hidden></p>
  </div>
  <div id="app"><p class="loading">Cargando previsión…</p></div>
  </div>
  <div id="view-playas" class="view" hidden></div>
  <p class="foot">Datos de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
</main>

<script>
const FALLBACK = {name:"Oviedo", admin1:"Asturias", country:"España", latitude:43.3614, longitude:-5.8494};
const KEY = "tiempo.predeterminada";
const $ = id => document.getElementById(id);
const app = $("app"), q = $("q"), resultsEl = $("results");

/* ---------- Ciudad predeterminada (guardada en el navegador) ---------- */
function loadDefault(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const c = JSON.parse(raw); if(c && typeof c.latitude==="number" && typeof c.longitude==="number") return c; }
  }catch(e){}
  return FALLBACK;
}
function saveDefault(c){
  try{ localStorage.setItem(KEY, JSON.stringify(c)); return true; }catch(e){ return false; }
}
let defaultCity = loadDefault();
let current = defaultCity;
const same = (a,b) => Math.abs(a.latitude-b.latitude)<0.01 && Math.abs(a.longitude-b.longitude)<0.01;

/* ---------- Iconos y textos del tiempo ---------- */
const WMO = {
  0:["Despejado","clear"],1:["Casi despejado","clear"],2:["Parcialmente nublado","partly"],3:["Cubierto","cloud"],
  45:["Niebla","fog"],48:["Niebla con escarcha","fog"],
  51:["Llovizna ligera","drizzle"],53:["Llovizna","drizzle"],55:["Llovizna intensa","drizzle"],56:["Llovizna helada","drizzle"],57:["Llovizna helada","drizzle"],
  61:["Lluvia ligera","rain"],63:["Lluvia","rain"],65:["Lluvia fuerte","rain"],66:["Lluvia helada","rain"],67:["Lluvia helada fuerte","rain"],
  71:["Nieve ligera","snow"],73:["Nieve","snow"],75:["Nieve fuerte","snow"],77:["Granizo fino","snow"],
  80:["Chubascos ligeros","rain"],81:["Chubascos","rain"],82:["Chubascos fuertes","rain"],
  85:["Chubascos de nieve","snow"],86:["Chubascos de nieve fuertes","snow"],
  95:["Tormenta","storm"],96:["Tormenta con granizo","storm"],99:["Tormenta con granizo fuerte","storm"]
};
const info = c => WMO[c] || ["—","cloud"];
const CLOUD = '<path d="M14 36h20a8 8 0 0 0 .9-15.95A10 10 0 0 0 15.4 22 7 7 0 0 0 14 36z" fill="var(--cloud)"/>';
const SUN = (x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--sun)"/>`;
const MOON = '<path d="M30 8a13 13 0 1 0 10 21A11 11 0 0 1 30 8z" fill="var(--sun)"/>';
function rays(x,y,r){
  let s=""; for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=x+Math.cos(a)*(r+3),y1=y+Math.sin(a)*(r+3),x2=x+Math.cos(a)*(r+7),y2=y+Math.sin(a)*(r+7);
  s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--sun)" stroke-width="2.5" stroke-linecap="round"/>`;} return s;
}
const drops = (n)=>{const xs=[18,26,34].slice(0,n);return xs.map(x=>`<line x1="${x}" y1="39" x2="${x-3}" y2="45" stroke="var(--rain)" stroke-width="2.5" stroke-linecap="round"/>`).join("")};
function icon(code,isDay=1){
  const k = info(code)[1]; let b="";
  if(k==="clear") b = isDay ? SUN(24,24,9)+rays(24,24,9) : MOON;
  else if(k==="partly") b = (isDay ? SUN(18,16,7)+rays(18,16,7) : '<path d="M20 5a9 9 0 1 0 8 14A8 8 0 0 1 20 5z" fill="var(--sun)"/>') + CLOUD;
  else if(k==="cloud") b = CLOUD;
  else if(k==="fog") b = CLOUD+'<line x1="12" y1="40" x2="36" y2="40" stroke="var(--cloud)" stroke-width="2.5" stroke-linecap="round"/><line x1="16" y1="45" x2="32" y2="45" stroke="var(--cloud)" stroke-width="2.5" stroke-linecap="round"/>';
  else if(k==="drizzle") b = CLOUD+drops(2);
  else if(k==="rain") b = CLOUD+drops(3);
  else if(k==="snow") b = CLOUD+[18,26,34].map(x=>`<circle cx="${x}" cy="42" r="2" fill="var(--rain)"/>`).join("");
  else if(k==="storm") b = CLOUD+'<path d="M26 34l-6 8h5l-2 6 8-9h-5z" fill="var(--sun)"/>';
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${b}</svg>`;
}

/* ---------- Utilidades ---------- */
const DIRS = ["N","NE","E","SE","S","SO","O","NO"];
const dirText = d => DIRS[Math.round(d/45)%8];
const r = n => Math.round(n);
const g = (arr,k) => (arr && arr[k]!=null) ? arr[k] : null;
const f1 = n => n.toFixed(1).replace(".",",");
const uvWord = u => u<3 ? "Bajo" : u<6 ? "Moderado" : u<8 ? "Alto" : u<11 ? "Muy alto" : "Extremo";
const stat = (label, value, sub) => `<div class="hs"><span>${label}</span><b class="num">${value==null?"—":value}</b>${sub?`<small class="num">${sub}</small>`:""}</div>`;
let moreOpen = false;
function placeLine(c){ return [c.admin1, c.country].filter(Boolean).join(", "); }
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }
function dayName(iso,i){ if(i===0) return "Hoy"; return new Date(iso+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short"}).replace(".",""); }

/* ---------- Última previsión guardada (para abrir sin conexión) ---------- */
const FKEY = "tiempo.ultima";
function saveForecast(c, data){
  try{ localStorage.setItem(FKEY, JSON.stringify({lat:c.latitude, lon:c.longitude, ts:Date.now(), data})); }catch(e){}
}
function readForecast(c){
  try{
    const o = JSON.parse(localStorage.getItem(FKEY));
    if(o && Math.abs(o.lat-c.latitude)<0.01 && Math.abs(o.lon-c.longitude)<0.01 && o.data) return o;
  }catch(e){}
  return null;
}

/* ---------- Previsión ---------- */
async function loadForecast(c){
  current = c;
  app.innerHTML = '<p class="loading">Cargando previsión…</p>';
  const url = "https://api.open-meteo.com/v1/forecast?latitude="+c.latitude+"&longitude="+c.longitude
    + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day"
    + "&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,is_day,relative_humidity_2m,dew_point_2m,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,pressure_msl,visibility,snowfall"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,uv_index_max"
    + "&timezone=auto&forecast_days=7";
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    saveForecast(c, data);
    render(c, data);
  }catch(e){
    const old = readForecast(c);
    if(old){
      render(c, old.data);
      const mins = Math.max(1, Math.round((Date.now()-old.ts)/60000));
      const ago = mins < 60 ? mins+" min" : mins < 1440 ? Math.round(mins/60)+" h" : Math.round(mins/1440)+" d";
      app.insertAdjacentHTML("afterbegin", '<p class="offline" role="status">Sin conexión. Datos guardados hace '+ago+'.</p>');
      return;
    }
    app.innerHTML = '<div class="hero"><h2>No se pudo cargar la previsión</h2><p class="feels">Comprueba tu conexión e inténtalo de nuevo.</p><div><button class="btn primary" id="retry" type="button">Reintentar</button></div></div>';
    $("retry").onclick = () => loadForecast(c);
  }
}

function render(c, d){
  const cur = d.current, h = d.hourly, dl = d.daily;
  const [desc] = info(cur.weather_code);
  const isDefault = same(c, defaultCity);

  // Horas: desde la hora actual, 24 entradas
  const nowKey = cur.time.slice(0,13);
  let start = h.time.findIndex(t => t.slice(0,13) >= nowKey); if(start<0) start = 0;
  const hourCell = (i, label, cls) => {
    const p = h.precipitation_probability[i];
    return `<button type="button" class="hour ${cls||""}" data-k="${i}" aria-pressed="false" aria-label="${label}, ${r(h.temperature_2m[i])} grados, ${esc(info(h.weather_code[i])[0])}"><span class="t num">${label}</span>${icon(h.weather_code[i],h.is_day[i])}<span class="d num">${r(h.temperature_2m[i])}°</span><span class="p num">${p>=20?p+"%":""}</span></button>`;
  };
  let hoursHtml = "";
  for(let i=start;i<Math.min(start+24,h.time.length);i++){
    hoursHtml += hourCell(i, i===start?"Ahora":h.time[i].slice(11,13)+"h", i===start?"now":"");
  }

  // Días
  const wmin = Math.min(...dl.temperature_2m_min), wmax = Math.max(...dl.temperature_2m_max), span = (wmax-wmin)||1;
  let daysHtml = "";
  dl.time.forEach((t,i)=>{
    const lo = dl.temperature_2m_min[i], hi = dl.temperature_2m_max[i];
    const left = ((lo-wmin)/span*100).toFixed(1), width = Math.max(((hi-lo)/span*100),6).toFixed(1);
    const pp = dl.precipitation_probability_max[i], mm = dl.precipitation_sum[i];
    const rainTxt = (pp>=20 || mm>=0.5) ? `<span class="rain num">${pp!=null?pp+"% de lluvia":""}${mm>=0.1?" · "+mm.toFixed(1).replace(".",",")+" mm":""}</span>` : "";
    const chev = '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    daysHtml += `<li class="day-item"><button class="day" type="button" aria-expanded="false" aria-controls="det-${i}" data-i="${i}"><span class="name">${esc(dayName(t,i))}</span>${icon(dl.weather_code[i],1)}<span class="lo num">${r(lo)}°</span><span class="range"><i style="left:${left}%;width:${width}%"></i></span><span class="hi num">${r(hi)}°</span>${chev}${rainTxt}</button><div class="day-detail" id="det-${i}" hidden></div></li>`;
  });

  app.innerHTML = `
  <div class="hero">
    <div class="hero-top">
      <div class="place"><h1>${esc(c.name)}</h1><p>${esc(placeLine(c))}</p></div>
      <button class="pin" id="pin" type="button" aria-pressed="${isDefault}">${isDefault?"★ Predeterminada":"☆ Hacer predeterminada"}</button>
    </div>
    <div class="now">
      ${icon(cur.weather_code, cur.is_day)}
      <div>
        <div class="temp num">${r(cur.temperature_2m)}°</div>
        <div class="desc">${esc(desc)}</div>
        <div class="feels num">Sensación ${r(cur.apparent_temperature)}° · Máx ${r(dl.temperature_2m_max[0])}° / Mín ${r(dl.temperature_2m_min[0])}°</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>Viento</span><b class="num">${r(cur.wind_speed_10m)} km/h ${dirText(cur.wind_direction_10m)}</b></div>
      <div class="stat"><span>Humedad</span><b class="num">${r(cur.relative_humidity_2m)}%</b></div>
      <div class="stat"><span>Lluvia ahora</span><b class="num">${cur.precipitation.toFixed(1).replace(".",",")} mm</b></div>
      <div class="stat"><span>Índice UV</span><b class="num">${r(dl.uv_index_max[0])}</b></div>
      <div class="stat"><span>Amanecer</span><b class="num">${dl.sunrise[0].slice(11,16)}</b></div>
      <div class="stat"><span>Atardecer</span><b class="num">${dl.sunset[0].slice(11,16)}</b></div>
    </div>
  </div>
  <section class="box"><h2>Próximas 24 horas</h2><p class="hint">Toca una hora para ver el detalle.</p><div class="strip"><div class="hours">${hoursHtml}</div><div class="hpanel" hidden></div></div></section>
  <section class="box"><h2>Próximos 7 días</h2><p class="hint">Toca un día para ver sus horas y una hora para ver el detalle.</p><ul class="days">${daysHtml}</ul></section>`;

  function toggleDay(btn){
    const i = +btn.dataset.i, det = $("det-"+i), wasOpen = btn.getAttribute("aria-expanded")==="true";
    app.querySelectorAll(".day").forEach(b => { b.setAttribute("aria-expanded","false"); $("det-"+b.dataset.i).hidden = true; });
    if(wasOpen) return;
    const date = dl.time[i]; let cells = "";
    for(let k=0;k<h.time.length;k++){
      if(!h.time[k].startsWith(date)) continue;
      const isNow = (i===0 && k===start);
      cells += hourCell(k, isNow ? "Ahora" : h.time[k].slice(11,13)+"h", isNow ? "now" : (i===0 && k<start ? "past" : ""));
    }
    const mm = dl.precipitation_sum[i];
    det.innerHTML = `<p class="det-sum num">Amanece ${dl.sunrise[i].slice(11,16)} · Anochece ${dl.sunset[i].slice(11,16)} · Lluvia ${mm.toFixed(1).replace(".",",")} mm</p><div class="strip"><div class="hours">${cells}</div><div class="hpanel" hidden></div></div>`;
    det.hidden = false; btn.setAttribute("aria-expanded","true");
    const strip = det.querySelector(".hours"), nowEl = strip.querySelector(".now");
    if(nowEl) strip.scrollLeft = Math.max(0, nowEl.offsetLeft - 8);
  }
  app.querySelectorAll(".day").forEach(btn => btn.onclick = () => toggleDay(btn));

  // Detalle de una hora concreta
  function hourPanel(k){
    const temp = g(h.temperature_2m,k), feel = g(h.apparent_temperature,k), code = h.weather_code[k], day = h.is_day[k];
    const mm = g(h.precipitation,k), pp = g(h.precipitation_probability,k);
    const ws = g(h.wind_speed_10m,k), wd = g(h.wind_direction_10m,k), gu = g(h.wind_gusts_10m,k);
    const hum = g(h.relative_humidity_2m,k), cc = g(h.cloud_cover,k), uv = g(h.uv_index,k);
    const pr = g(h.pressure_msl,k), vis = g(h.visibility,k), dew = g(h.dew_point_2m,k), sn = g(h.snowfall,k);
    const notes = [];
    if((mm!=null && mm>=0.1) || (pp!=null && pp>=60)) notes.push("Lleva paraguas.");
    if(gu!=null && gu>=60) notes.push("Rachas fuertes de "+r(gu)+" km/h.");
    else if(gu!=null && gu>=40) notes.push("Viento con rachas de "+r(gu)+" km/h.");
    if(uv!=null && day && uv>=6) notes.push("UV alto: usa protección solar.");
    if(feel!=null && feel<=5) notes.push("Hace frío, abrígate.");
    else if(feel!=null && feel>=30) notes.push("Mucho calor: hidrátate.");
    if(vis!=null && vis<1000) notes.push("Poca visibilidad.");
    const summary = (info(code)[0] + (temp!=null ? ", "+r(temp)+"°" : "") + ". " + notes.slice(0,2).join(" ")).trim();
    const weekday = new Date(h.time[k].slice(0,10)+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long"});
    const main = [
      stat("Sensación", feel!=null ? r(feel)+"°" : null, temp!=null ? "Real "+r(temp)+"°" : ""),
      stat("Lluvia", mm!=null ? f1(mm)+" mm" : null, pp!=null ? "Prob. "+pp+"%" : ""),
      stat("Viento", ws!=null ? r(ws)+" km/h"+(wd!=null ? " "+dirText(wd) : "") : null, gu!=null ? "Rachas "+r(gu)+" km/h" : ""),
      stat("Humedad", hum!=null ? r(hum)+"%" : null),
      stat("Nubosidad", cc!=null ? r(cc)+"%" : null),
      stat("Índice UV", uv!=null ? f1(uv) : null, uv!=null ? uvWord(uv) : "")
    ].join("");
    const more = [
      stat("Presión", pr!=null ? r(pr)+" hPa" : null),
      stat("Visibilidad", vis!=null ? (vis>=10000 ? r(vis/1000) : f1(vis/1000))+" km" : null),
      stat("Punto de rocío", dew!=null ? r(dew)+"°" : null),
      (sn!=null && sn>0) ? stat("Nieve", f1(sn)+" cm") : ""
    ].join("");
    return `<div class="hp-head">${esc(weekday)} ${h.time[k].slice(11,16)}</div><p class="hp-sum">${esc(summary)}</p><div class="hgrid">${main}</div><details class="more"${moreOpen?" open":""}><summary>Más detalles</summary><div class="hgrid">${more}</div></details>`;
  }
  app.onclick = e => {
    const cell = e.target.closest(".hour[data-k]"); if(!cell) return;
    const strip = cell.closest(".strip"), panel = strip.querySelector(".hpanel");
    const was = cell.getAttribute("aria-pressed")==="true";
    strip.querySelectorAll(".hour").forEach(b => b.setAttribute("aria-pressed","false"));
    if(was){ panel.hidden = true; return; }
    cell.setAttribute("aria-pressed","true");
    panel.innerHTML = hourPanel(+cell.dataset.k);
    panel.querySelector("details").ontoggle = ev => { moreOpen = ev.target.open; };
    panel.hidden = false;
    panel.scrollIntoView({block:"nearest"});
  };

  $("pin").onclick = () => {
    defaultCity = {name:c.name, admin1:c.admin1||"", country:c.country||"", latitude:c.latitude, longitude:c.longitude};
    const ok = saveDefault(defaultCity);
    const b = $("pin"); b.setAttribute("aria-pressed","true"); b.textContent = ok ? "★ Predeterminada" : "★ Predeterminada (solo esta sesión)";
  };
}

/* ---------- Búsqueda de ciudades ---------- */
let timer, searchSeq = 0, lastResults = [];
function hideResults(){ resultsEl.hidden = true; resultsEl.innerHTML = ""; }
async function search(term){
  const seq = ++searchSeq;
  try{
    const res = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(term)+"&count=6&language=es&format=json");
    const data = await res.json();
    if(seq !== searchSeq) return;
    lastResults = data.results || [];
    resultsEl.hidden = false;
    if(!lastResults.length){ resultsEl.innerHTML = '<div class="msg">Sin resultados para «'+esc(term)+'».</div>'; return; }
    resultsEl.innerHTML = lastResults.map((c,i)=>`<button class="result" type="button" role="option" data-i="${i}">${esc(c.name)}<small>${esc(placeLine(c))}</small></button>`).join("");
  }catch(e){
    if(seq !== searchSeq) return;
    resultsEl.hidden = false; resultsEl.innerHTML = '<div class="msg">No se pudo buscar. Revisa tu conexión.</div>';
  }
}
function pick(c){ userPicked = true; hideResults(); q.value = ""; q.blur(); showNote(""); loadForecast(c); window.scrollTo({top:0}); }
q.addEventListener("input", () => {
  clearTimeout(timer); const v = q.value.trim();
  if(v.length < 2){ searchSeq++; hideResults(); return; }
  timer = setTimeout(()=>search(v), 250);
});
$("form").addEventListener("submit", async e => {
  e.preventDefault(); const v = q.value.trim(); if(v.length<2) return;
  clearTimeout(timer); await search(v);
  if(lastResults.length===1) pick(lastResults[0]);
});
resultsEl.addEventListener("click", e => { const b = e.target.closest(".result"); if(b) pick(lastResults[+b.dataset.i]); });
document.addEventListener("click", e => { if(!e.target.closest(".search")) hideResults(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") hideResults(); });

/* ---------- Mi ubicación ---------- */
const MKEY = "tiempo.modo";
const locBtn = $("loc"), autoBox = $("auto"), noteEl = $("note");
let userPicked = false;
function getMode(){ try{ return localStorage.getItem(MKEY) || "fija"; }catch(e){ return "fija"; } }
function setMode(m){ try{ localStorage.setItem(MKEY, m); }catch(e){} }
function showNote(t){ noteEl.textContent = t; noteEl.hidden = !t; }

async function reverseName(lat, lon){
  try{
    const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=es");
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d = await res.json();
    const name = d.city || d.locality || d.principalSubdivision || "Mi ubicación";
    const admin = d.principalSubdivision && d.principalSubdivision !== name ? d.principalSubdivision : "";
    return {name, admin1:admin, country:d.countryName || ""};
  }catch(e){
    return {name:"Mi ubicación", admin1:"", country:""};
  }
}

function locate(auto){
  if(!("geolocation" in navigator)){ if(!auto) showNote("Este navegador no permite obtener la ubicación."); return; }
  locBtn.disabled = true;
  if(!auto) showNote("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
    const place = await reverseName(lat, lon);
    locBtn.disabled = false;
    if(auto && userPicked){ showNote(""); return; }   // si ya elegiste otra ciudad, no se la quitamos
    showNote("");
    hideResults();
    loadForecast({name:place.name, admin1:place.admin1, country:place.country, latitude:lat, longitude:lon});
  }, err => {
    locBtn.disabled = false;
    if(auto){ showNote(""); return; }
    showNote(err.code === 1
      ? "No hay permiso de ubicación. Actívalo en los ajustes del navegador para este sitio."
      : err.code === 3 ? "Tardó demasiado en obtener la ubicación. Inténtalo de nuevo."
      : "No se pudo obtener tu ubicación.");
  }, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
}

locBtn.addEventListener("click", () => { userPicked = true; locate(false); });
autoBox.checked = getMode() === "gps";
autoBox.addEventListener("change", () => {
  setMode(autoBox.checked ? "gps" : "fija");
  if(autoBox.checked){ userPicked = true; locate(false); } else showNote("");
});

const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const angDiff = (a,b) => Math.abs(((a-b+540)%360)-180);
function vecDir(pairs){            // dirección media del viento, ponderada por velocidad
  let x=0, y=0;
  pairs.forEach(([s,d]) => { const a=d*Math.PI/180; x+=s*Math.sin(a); y+=s*Math.cos(a); });
  return (Math.atan2(x,y)*180/Math.PI+360)%360;
}
function scoreLabel(s){ return s>=80 ? "Muy cómoda" : s>=65 ? "Cómoda" : s>=50 ? "Regular" : s>=35 ? "Incómoda" : "Muy incómoda"; }
function scoreColor(s){ return s>=65 ? "var(--good)" : s>=40 ? "var(--warn)" : "var(--bad)"; }

  pb.started = true;

async function getJson(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}
async function loadBeaches(){
  const lat = BEACHES.map(b => b.lat).join(","), lon = BEACHES.map(b => b.lon).join(",");
  const tz = "&timezone=Europe%2FMadrid&forecast_days=7";
  const [f, m, tm] = await Promise.allSettled([
    getJson("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&hourly=temperature_2m,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index"+tz),
    getJson("https://marine-api.open-meteo.com/v1/marine?latitude="+lat+"&longitude="+lon+"&hourly=wave_height"+tz),
    // Mareas en petición aparte: un día antes y uno después para no perder pleamares en los bordes
    getJson("https://marine-api.open-meteo.com/v1/marine?latitude="+lat+"&longitude="+lon+"&hourly=sea_level_height_msl&past_days=1&forecast_days=8&timezone=Europe%2FMadrid")
  ]);
  pb.data = null; pb.stale = null;
  try{
    if(f.status !== "fulfilled") throw new Error("sin previsión");
    const F = [].concat(f.value);   // un solo punto devuelve un objeto; varios, una lista
    if(F.length !== BEACHES.length) throw new Error("respuesta incompleta");
    let M = null;
    if(m.status === "fulfilled"){ M = [].concat(m.value); if(M.length !== BEACHES.length) M = null; }
    let T = null;
    if(tm.status === "fulfilled"){ T = [].concat(tm.value); if(T.length !== BEACHES.length) T = null; }
    pb.data = {F, M, T, ts:Date.now()};
    try{ localStorage.setItem(PKEY, JSON.stringify(pb.data)); }catch(e){}
  }catch(e){
    try{
      const old = JSON.parse(localStorage.getItem(PKEY));
      if(old && Array.isArray(old.F) && old.F.length === BEACHES.length){ pb.data = old; pb.stale = old.ts; }
    }catch(e2){}
  }
  if(pb.data){
    buildTides();
    const h = new Date().getHours();
    pb.day = 0;
    if(h <= 14) pb.slot = "manana"; else if(h <= 19) pb.slot = "tarde"; else { pb.slot = "manana"; pb.day = 1; }
  }
  renderBeaches();
}

function beachDates(){
  const seen = [];
  pb.data.F[0].hourly.time.forEach(t => { const d = t.slice(0,10); if(!seen.includes(d)) seen.push(d); });
  return seen;
}
function inSlot(t, date, S){
  if(!t.startsWith(date)) return false;
  const hh = +t.slice(11,13);
  return hh >= S.from && hh <= S.to;
}
function computeBeach(i, date, slot){
  const b = BEACHES[i], S = SLOTS[slot], sh = SHELTER[b.abrigo], hf = pb.data.F[i].hourly;
  const ix = [];
  hf.time.forEach((t,k) => { if(inSlot(t, date, S)) ix.push(k); });
  const col = name => ix.map(k => hf[name] ? hf[name][k] : null).filter(v => v != null);
  const pairs = ix.filter(k => hf.wind_speed_10m[k] != null && hf.wind_direction_10m[k] != null)
                  .map(k => [hf.wind_speed_10m[k], hf.wind_direction_10m[k]]);
  if(!pairs.length) return null;
  const wind = mean(pairs.map(p => p[0])), dir = vecDir(pairs);
  const gu = col("wind_gusts_10m"), gust = gu.length ? Math.max(...gu) : wind;
  const te = col("temperature_2m"), pr = col("precipitation"), uv = col("uv_index");
  let wave = null;
  const mh = pb.data.M && pb.data.M[i] && pb.data.M[i].hourly;
  if(mh && mh.wave_height){
    const w = [];
    mh.time.forEach((t,k) => { if(inSlot(t, date, S) && mh.wave_height[k] != null) w.push(mh.wave_height[k]); });
    if(w.length) wave = mean(w);
  }
  const rel = angDiff(dir, b.face);
  const kind = rel <= 60 ? "mar" : rel <= 120 ? "lateral" : "tierra";
  const dirF = kind === "mar" ? 1 : kind === "lateral" ? 0.85 : 0.7;
  const effW = wind*sh.wind*dirF, effG = gust*sh.wind*dirF, effV = wave == null ? 0 : wave*sh.wave;
  let score = 100 - Math.min(55, effW*2.2) - Math.min(25, Math.max(0, effG-30)*0.8) - Math.min(30, Math.max(0, effV-0.5)*20);
  score = Math.max(0, Math.round(score));
  return {b, wind, dir, gust, wave, kind, score,
          temp: te.length ? mean(te) : null,
          rain: pr.reduce((x,y)=>x+y, 0),
          uv: uv.length ? Math.max(...uv) : null,
          terral: kind === "tierra" && wind >= 12};
}
function beachDayLabel(d, i){
  if(i === 0) return "Hoy";
  if(i === 1) return "Mañana";
  return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short"}).replace(".","");
}

/* ---- Mareas ---- */
const capTide = t => t === "pleamar" ? "Pleamar" : "Bajamar";
const fmtH = h => (h >= 0 ? "+" : "−") + f1(Math.abs(h)) + " m";
function longDay(date, i){
  if(i === 0) return "de hoy";
  if(i === 1) return "de mañana";
  return "del " + new Date(date+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long", day:"numeric"});
}
function seriesOf(i){
  const t = pb.data && pb.data.T && pb.data.T[i];
  return t && t.hourly && t.hourly.sea_level_height_msl && t.hourly.time ? t.hourly : null;
}
// Pleamares y bajamares de una serie horaria de nivel del mar: máximos y mínimos locales,
// afinados con una parábola para no quedar atados a la hora en punto.
function tideEvents(time, v){
  const ev = [], w = 3;
  for(let k = w; k < v.length - w; k++){
    if(v[k] == null) continue;
    let mx = true, mn = true;
    for(let j = 1; j <= w && (mx || mn); j++){
      const a = v[k-j], b = v[k+j];
      if(a == null || b == null){ mx = mn = false; break; }
      if(!(v[k] >= a && v[k] > b)) mx = false;
      if(!(v[k] <= a && v[k] < b)) mn = false;
    }
    if(!mx && !mn) continue;
    const y0 = v[k-1], y1 = v[k], y2 = v[k+1], den = y0 - 2*y1 + y2;
    let off = 0, hgt = y1;
    if(den !== 0){
      off = 0.5*(y0 - y2)/den;
      if(off > 0.5 || off < -0.5) off = 0; else hgt = y1 - 0.25*(y0 - y2)*off;
    }
    const base = Date.parse(time[k]+":00Z");
    const step = off >= 0 ? Date.parse(time[k+1]+":00Z") - base : base - Date.parse(time[k-1]+":00Z");
    const ms = Math.round((base + off*step)/300000)*300000;     // a múltiplos de 5 minutos
    const iso = new Date(ms).toISOString();
    ev.push({type: mx ? "pleamar" : "bajamar", ms, date: iso.slice(0,10), hhmm: iso.slice(11,16), h: hgt});
  }
  return ev;
}
function buildTides(){
  pb.ev = BEACHES.map((b,i) => { const s = seriesOf(i); return s ? tideEvents(s.time, s.sea_level_height_msl) : []; });
  // Si a una playa le faltan datos, usa los de la playa con datos más cercana
  pb.src = BEACHES.map((b,i) => {
    if(pb.ev[i].length) return i;
    let best = -1, bd = Infinity;
    BEACHES.forEach((o,j) => {
      if(!pb.ev[j].length) return;
      const d = Math.hypot(o.lat - b.lat, (o.lon - b.lon)*0.73);
      if(d < bd){ bd = d; best = j; }
    });
    return best;
  });
}
function dayEvents(i, date){
  const s = pb.src ? pb.src[i] : -1;
  return (s != null && s >= 0) ? pb.ev[s].filter(e => e.date === date) : [];
}
function evInSlot(evs, date, S){
  const d0 = Date.parse(date+"T00:00:00Z");
  return evs.filter(e => e.ms >= d0 + S.from*36e5 && e.ms < d0 + (S.to+1)*36e5);
}

// Curva de marea del día (una sola serie): línea de 2 px, área tenue, extremos etiquetados y franja elegida sombreada.
function tideChart(ref, date){
  pb.tc = null;
  const s = pb.src ? pb.src[ref] : -1;
  if(s == null || s < 0) return "";
  const hs = seriesOf(s); if(!hs) return "";
  const v = hs.sea_level_height_msl, pts = [];
  hs.time.forEach((t,k) => { if(t.startsWith(date) && v[k] != null) pts.push({hr:+t.slice(11,13), v:v[k]}); });
  const nxt = new Date(Date.parse(date+"T00:00:00Z") + 864e5).toISOString().slice(0,10);
  const kn = hs.time.indexOf(nxt+"T00:00");
  if(kn >= 0 && v[kn] != null) pts.push({hr:24, v:v[kn]});
  if(pts.length < 20) return "";
  const evs = pb.ev[s].filter(e => e.date === date);
  const W = 320, H = 130, pL = 10, pR = 10, pT = 26, pB = 36, pw = W-pL-pR, ph = H-pT-pB;
  let lo = Math.min(...pts.map(p => p.v), ...evs.map(e => e.h)), hi = Math.max(...pts.map(p => p.v), ...evs.map(e => e.h));
  if(hi - lo < 0.5){ lo -= 0.25; hi += 0.25; }
  const xs = hr => pL + hr/24*pw, ys = val => pT + (hi - val)/(hi - lo)*ph;
  const n1 = n => n.toFixed(1), S = SLOTS[pb.slot];
  const line = pts.map((p,k) => (k ? "L" : "M") + n1(xs(p.hr)) + " " + n1(ys(p.v))).join(" ");
  const area = line + " L" + n1(xs(pts[pts.length-1].hr)) + " " + (H-pB) + " L" + n1(xs(pts[0].hr)) + " " + (H-pB) + " Z";
  const band = `<rect x="${n1(xs(S.from))}" y="${pT}" width="${n1(xs(Math.min(24, S.to+1)) - xs(S.from))}" height="${ph}" fill="var(--bar)" opacity=".35"/>`;
  const grid = [6,12,18].map(hr => `<line x1="${n1(xs(hr))}" y1="${pT}" x2="${n1(xs(hr))}" y2="${H-pB}" stroke="var(--line)" stroke-width="1"/>`).join("")
    + `<line x1="${pL}" y1="${H-pB}" x2="${W-pR}" y2="${H-pB}" stroke="var(--line)" stroke-width="1"/>`;
  const ticks = [0,6,12,18,24].map(hr => `<text x="${n1(xs(hr))}" y="${H-6}" text-anchor="${hr === 0 ? "start" : hr === 24 ? "end" : "middle"}">${hr} h</text>`).join("");
  const marks = evs.map(e => {
    const hr = (e.ms - Date.parse(date+"T00:00:00Z"))/36e5, x = xs(Math.max(0, Math.min(24, hr))), y = ys(e.h);
    const anchor = x < 26 ? "start" : x > W-26 ? "end" : "middle", up = e.type === "pleamar";
    return `<circle cx="${n1(x)}" cy="${n1(y)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`
         + `<text class="tl" x="${n1(x)}" y="${n1(up ? y-9 : y+17)}" text-anchor="${anchor}">${e.hhmm}</text>`;
  }).join("");
  const label = "Curva de marea. " + (evs.length ? evs.map(e => capTide(e.type)+" a las "+e.hhmm).join(", ") + "." : "");
  pb.tc = {pts, W, pL, pw, xs, ys};
  return `<svg id="tsvg" class="tsvg" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(label)}">`
    + band + grid + `<path d="${area}" fill="var(--accent)" opacity=".1"/>`
    + `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
    + marks + ticks
    + `<line id="tcross" x1="0" x2="0" y1="${pT}" y2="${H-pB}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`
    + `<circle id="tdot" r="4" cx="0" cy="0" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`
    + `</svg>`;
}
function tideCard(date){
  const ref = BEACHES.findIndex(b => b.id === "sanlorenzo");
  const evs = dayEvents(ref, date), ch = tideChart(ref, date);
  if(!evs.length && !ch){
    return '<section class="box"><h2>Mareas</h2><p class="tsum">No hay datos de mareas ahora mismo. Consulta una tabla de mareas antes de ir.</p></section>';
  }
  const rb = BEACHES[pb.src[ref]];
  const lis = evs.map(e => `<li><span>${capTide(e.type)}</span><b class="num">${e.hhmm}</b> <small class="num">${fmtH(e.h)}</small></li>`).join("");
  const hv = evs.map(e => e.h);
  let sum = "";
  if(hv.length >= 2){
    const rg = Math.max(...hv) - Math.min(...hv);
    sum = "Oscilación del día: " + f1(rg) + " m (" + (rg < 2.2 ? "mareas pequeñas" : rg < 3.4 ? "mareas moderadas" : "mareas grandes") + ").";
  }
  const resumen = evs.map(e => (e.type === "pleamar" ? "Pleamar " : "Bajamar ") + e.hhmm).join(" · ");
  return `<section class="box tcard"><details${pb.tideOpen ? " open" : ""} id="tdet"><summary><h2>Mareas ${longDay(date, pb.day)}</h2>${resumen ? `<small class="tsub num">${resumen}</small>` : ""}</summary>
    <p class="hint">Referencia: ${esc(rb.name)} (${esc(rb.town)}). Horas aproximadas y alturas sobre el nivel medio del mar. La franja elegida aparece sombreada.</p>
    ${ch ? `<div class="tide">${ch}<div id="tread" class="tread" aria-live="polite">Toca la curva para ver la altura a cada hora.</div></div>` : ""}
    <ul class="tev">${lis}</ul>${sum ? `<p class="tsum">${sum}</p>` : ""}</details></section>`;
}
function wireTide(){
  const svg = $("tsvg"), tc = pb.tc;
  if(!svg || !tc) return;
  const cross = svg.querySelector("#tcross"), dot = svg.querySelector("#tdot"), out = $("tread"), def = out.textContent;
  let cur = 12;
  function show(hr){
    cur = hr;
    const p = tc.pts.find(q => q.hr === hr); if(!p) return;
    const x = tc.xs(hr), y = tc.ys(p.v);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("visibility", "visible");
    const a = tc.pts.find(q => q.hr === hr-1), b = tc.pts.find(q => q.hr === hr+1);
    const trend = (a && b) ? (b.v > a.v ? " · subiendo" : " · bajando") : "";
    const strong = document.createElement("b");
    strong.textContent = fmtH(p.v);
    out.textContent = "";
    out.append(strong, " a las " + String(hr).padStart(2,"0") + ":00" + trend);
  }
  function hide(){
    cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); out.textContent = def;
  }
  function hourAt(e){
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left)/r.width*tc.W;
    return Math.max(0, Math.min(23, Math.round((px - tc.pL)/tc.pw*24)));
  }
  svg.addEventListener("pointermove", e => show(hourAt(e)));
  svg.addEventListener("pointerdown", e => show(hourAt(e)));
  svg.addEventListener("pointerleave", e => { if(e.pointerType !== "touch") hide(); });
  svg.addEventListener("focus", () => show(cur));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", e => {
    if(e.key === "ArrowLeft"){ e.preventDefault(); show(Math.max(0, cur-1)); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); show(Math.min(23, cur+1)); }
  });
}

function renderBeaches(){
  if(!pb.data){
    pv.innerHTML = '<div class="hero"><h2>No se pudieron cargar las playas</h2><p class="feels">Comprueba tu conexión e inténtalo de nuevo.</p><div><button class="btn primary" id="pretry" type="button">Reintentar</button></div></div>';
    return;
  }
  const dates = beachDates();
  if(pb.day >= dates.length) pb.day = 0;
  const date = dates[pb.day], S = SLOTS[pb.slot];
  const rows = BEACHES.map((b,i) => computeBeach(i, date, pb.slot)).filter(Boolean).sort((a,b) => b.score - a.score);

  const dayChips = dates.map((d,i) => `<button class="chip" type="button" data-day="${i}" aria-pressed="${i===pb.day}">${esc(beachDayLabel(d,i))}</button>`).join("");
  const slotChips = Object.keys(SLOTS).map(k => `<button class="chip" type="button" data-slot="${k}" aria-pressed="${k===pb.slot}">${SLOTS[k].label} ${SLOTS[k].text}</button>`).join("");
  let html = `<div class="pctl"><div class="chips" aria-label="Día">${dayChips}</div><div class="chips" aria-label="Franja horaria">${slotChips}</div></div>`;

  if(pb.stale){
    const mins = Math.max(1, Math.round((Date.now()-pb.stale)/60000));
    const ago = mins < 60 ? mins+" min" : mins < 1440 ? Math.round(mins/60)+" h" : Math.round(mins/1440)+" d";
    html += '<p class="offline" role="status">Sin conexión. Datos guardados hace '+ago+'.</p>';
  }
  if(date === dates[0] && S.to < new Date().getHours()){
    html += '<p class="offline" role="status">Esta franja de hoy ya ha pasado.</p>';
  }

  if(!rows.length){
    html += '<div class="verdict"><h2>Sin datos para esta franja</h2><p>Prueba con otro día u otra franja horaria.</p></div>';
  }else{
    const best = rows[0];
    const bn = best.b.name+" ("+best.b.town+")";
    const title = best.score >= 65 ? "Mejor opción: "+bn
      : best.score >= 40 ? "Ninguna destaca. La menos incómoda: "+bn
      : "Día complicado para ir con niños a la playa";
    const rainAvg = mean(rows.map(r => r.rain));
    let sub = best.score < 40 ? "La mejor opción sería "+bn+", pero también hay viento fuerte o mar movido allí. " : "";
    sub += "Viento "+r(best.wind)+" km/h del "+dirText(best.dir)+", rachas de hasta "+r(best.gust)+" km/h"+(best.wave!=null ? ", oleaje de "+f1(best.wave)+" m" : "")+".";
    if(rainAvg >= 0.5) sub += " Se espera lluvia en la franja.";
    html += `<div class="verdict"><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`;
    html += tideCard(date);

    const items = rows.map((x,n) => {
      const sh = SHELTER[x.b.abrigo], open = pb.open === x.b.id;
      const waveTxt = x.wave != null ? " · Oleaje "+f1(x.wave)+" m" : "";
      const bi = BEACHES.indexOf(x.b), tevs = dayEvents(bi, date);
      const fit = x.b.tide ? evInSlot(tevs, date, S).find(e => e.type === x.b.tide) : null;
      const tags = `<span class="tag">${sh.text}</span><span class="tag">${KIND[x.kind]}</span>`
        + (x.terral ? '<span class="tag alert">Atención: viento de tierra, cuidado con flotadores y colchonetas</span>' : "")
        + (x.rain >= 0.5 ? '<span class="tag">Lluvia '+f1(x.rain)+' mm</span>' : "")
        + (fit ? '<span class="tag">'+capTide(fit.type)+' en tu franja ('+fit.hhmm+')</span>' : "");
      const borrowed = pb.src && pb.src[bi] >= 0 && pb.src[bi] !== bi;
      const tideNote = (tevs.length
          ? "Mareas "+longDay(date, pb.day)+": "+tevs.map(e => capTide(e.type)+" "+e.hhmm).join(" · ")+"."
            + (borrowed ? " Estimadas a partir de "+BEACHES[pb.src[bi]].name+", la playa con datos más cercana." : "")
          : "")
        + (x.b.tide ? (tevs.length ? " " : "")+"Esta playa va mejor con "+x.b.tide+": "+x.b.tideWhy : "");
      const detail = `<p class="bnote">${esc(x.b.note)}</p>${tideNote ? `<p class="bnote">${esc(tideNote)}</p>` : ""}<div class="hgrid">${[
        stat("Temperatura", x.temp != null ? r(x.temp)+"°" : null),
        stat("Lluvia", f1(x.rain)+" mm"),
        stat("UV máx.", x.uv != null ? f1(x.uv) : null, x.uv != null ? uvWord(x.uv) : ""),
        stat("Viento", r(x.wind)+" km/h "+dirText(x.dir), KIND[x.kind]),
        stat("Rachas", r(x.gust)+" km/h"),
        stat("Oleaje", x.wave != null ? f1(x.wave)+" m" : null, x.wave != null ? "Mar abierto" : "Sin datos")
      ].join("")}</div>`;
      return `<li class="bch"><button class="bh" type="button" data-id="${x.b.id}" aria-expanded="${open}" aria-controls="bd-${x.b.id}">
        <span class="rk num">${n+1}</span>
        <span class="bn"><b>${esc(x.b.name)}</b><small>${esc(x.b.town)} · ${x.b.zone}</small></span>
        <span class="bs"><b class="num">${x.score}</b><small>${scoreLabel(x.score)}</small></span>
        <span class="bbar"><i style="width:${x.score}%;background:${scoreColor(x.score)}"></i></span>
        <span class="bline num">Viento del ${dirText(x.dir)} ${r(x.wind)} km/h · Rachas ${r(x.gust)}${waveTxt}</span>
        <span class="btags">${tags}</span></button>
        <div class="bd" id="bd-${x.b.id}"${open ? "" : " hidden"}>${detail}</div></li>`;
    }).join("");
    html += `<section class="box"><h2>Playas, de más a menos cómoda</h2><ul class="blist">${items}</ul></section>`;
  }

  html += `<div class="pfoot">
    <details class="more"><summary>Cómo se calcula</summary>
      <p>La nota va de 0 a 100 y mide la comodidad en la arena con niños. Resta puntos por viento medio, rachas y oleaje de la franja elegida. El viento pesa menos en playas abrigadas, y el de tierra pesa menos que el del mar. Las mareas no cambian la nota; se muestran aparte porque cada playa va mejor con una marea distinta. El abrigo de cada playa es una estimación basada en las guías de turismo, y se supone que todas miran más o menos al norte. Los datos meteorológicos son de modelos con celdas de varios kilómetros, así que no recogen el resguardo de un acantilado concreto.</p>
    </details>
    <p>Las horas de marea son una estimación de un modelo y pueden variar media hora o más. Antes de ir, contrástalas con una tabla de mareas, por ejemplo la de <a href="https://es.windfinder.com/tide/gijon_este" target="_blank" rel="noopener">Gijón en Windfinder</a>. Las mareas cambian mucho estas playas: vigila siempre a los niños junto al agua.</p>
    <p>Descripciones de playas basadas en <a href="https://www.turismoasturias.es/es/-/blogs/las-mejores-playas-para-ir-con-ninos-en-asturias" target="_blank" rel="noopener">Turismo Asturias</a> y <a href="https://asturias.com/playas-para-ninos-en-asturias/" target="_blank" rel="noopener">asturias.com</a>. Oleaje y mareas de Open-Meteo Marine.</p>
  </div>`;
  pv.innerHTML = html;
  const td = $("tdet");
  if(td) td.ontoggle = () => { pb.tideOpen = td.open; try{ localStorage.setItem("tiempo.mareas", td.open ? "1" : "0"); }catch(e){} };
  wireTide();
}

pv.addEventListener("click", e => {
  const day = e.target.closest("[data-day]"), slot = e.target.closest("[data-slot]"), row = e.target.closest(".bh[data-id]");
  if(e.target.closest("#pretry")){ pb.started = false; initBeaches(); return; }
  if(day){ pb.day = +day.dataset.day; renderBeaches(); }
  else if(slot){ pb.slot = slot.dataset.slot; renderBeaches(); }
  else if(row){ pb.open = (pb.open === row.dataset.id) ? null : row.dataset.id; renderBeaches(); }
});

/* ---------- Pestañas ---------- */
const tabT = $("tab-tiempo"), tabP = $("tab-playas"), viewT = $("view-tiempo");
function showTab(name){
  const pl = name === "playas";
  (pl ? tabT : tabP).removeAttribute("aria-current");
  (pl ? tabP : tabT).setAttribute("aria-current","page");
  viewT.hidden = pl; pv.hidden = !pl;
  try{ history.replaceState(null, "", pl ? "#playas" : location.pathname + location.search); }catch(e){}
  if(pl) initBeaches();
}
tabT.addEventListener("click", () => showTab("tiempo"));
tabP.addEventListener("click", () => showTab("playas"));

loadForecast(defaultCity);
if(getMode() === "gps") locate(true);
if(location.hash === "#playas") showTab("playas");

/* ---------- App instalable: service worker ---------- */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
